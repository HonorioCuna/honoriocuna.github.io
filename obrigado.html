<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0B0D">
<meta name="color-scheme" content="dark">
<title>Mensagem enviada — Onorio Cuna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><rect width=%27100%27 height=%27100%27 fill=%27%230A0B0D%27/><text x=%2750%27 y=%2768%27 text-anchor=%27middle%27 font-family=%27serif%27 font-size=%2758%27 font-weight=%27900%27 fill=%27%23C9A24B%27>OC</text></svg>">
<style>
  .thanks-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6%;
  }
  .thanks-card{
    max-width:480px;
    text-align:center;
    border:1px solid var(--line);
    background:var(--bg-1);
    padding:56px 44px;
  }
  .thanks-logo{
    font-family:var(--font-display);
    font-weight:900;
    font-size:28px;
    margin-bottom:24px;
  }
  .thanks-title{
    font-family:var(--font-display);
    font-size:clamp(26px, 4vw, 34px);
    font-weight:600;
    margin-bottom:16px;
  }
  .thanks-text{
    color:var(--text-1);
    font-size:15px;
    line-height:1.6;
    margin-bottom:32px;
  }
  .thanks-back{
    display:inline-block;
    color:var(--gold);
    font-family:var(--font-mono);
    font-size:13px;
    letter-spacing:0.05em;
    border-bottom:1px solid var(--gold-dim);
    padding-bottom:2px;
  }
  .thanks-back:hover{ border-color:var(--gold); }
</style>
</head>
<body>

<div class="grain"></div>

<div class="thanks-wrap">
  <div class="thanks-card">
    <div class="thanks-logo">OC.</div>
    <h1 class="thanks-title">Mensagem recebida</h1>
    <p class="thanks-text">
      Obrigado pelo contato. Vou responder o mais breve possível,
      diretamente no e-mail ou WhatsApp que você informou.
    </p>
    <a href="https://honoriocuna.github.io/" class="thanks-back">← Voltar ao portfólio</a>
  </div>
</div>

</body>
</html>
